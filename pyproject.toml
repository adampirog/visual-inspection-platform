[project]
name = "visual-inspection-platform"
authors = [
    {name = "Adam Pirog", email = "pirog.adam@gmail.com"},
]
description = "Production-grade computer vision platform for industrial anomaly detection and defect segmentation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=9"
]

[project.urls]
homepage = "https://github.com/adampirog/visual-inspection-platform"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["visual_inspection_platform*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "visual_inspection_platform.version.__version__"}

[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
lines-after-imports = 2
