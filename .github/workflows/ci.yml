name: CI

on:
  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test dependencies
        run: |
          python -m pip install -e ".[all]" --group dev

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t visual-inspection-platform:ci .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name visual-inspection-platform-ci \
            --publish 8000:8000 \
            visual-inspection-platform:ci

      - name: Check health endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 1 \
            --retry-all-errors \
            http://localhost:8000/health

      - name: Test inference dependencies
        run: |
          docker exec -i visual-inspection-platform-ci python - <<'PY'
          from importlib.util import find_spec

          import numpy as np
          from PIL import Image

          from visual_inspection_platform.models.pca import PCADetector
          from visual_inspection_platform.postprocessors import ThresholdPostprocessor

          # Ensure training dependencies are absent.
          for name in ("sklearn", "scipy", "tqdm", "prettytable"):
              assert find_spec(name) is None, f"{name} leaked into inference image"

          # Create a PCA artifact.
          PCADetector(
              model_id="smoke-pca",
              image_size=(2, 3),
              mean=np.zeros(18, dtype=np.float32),
              components=np.eye(1, 18, dtype=np.float32),
              postprocessor=ThresholdPostprocessor(0.25),
          ).save("/models/smoke-pca")

          Image.new("RGB", (6, 4), (255, 0, 0)).save("/tmp/smoke.png")
          PY

          docker cp \
            visual-inspection-platform-ci:/tmp/smoke.png \
            "$RUNNER_TEMP/smoke.png"

          # Discover the new artifact.
          curl -fsS -X POST \
            http://localhost:8000/admin/models/refresh

          # Test PCA inference.
          curl -fsS -X POST \
            "http://localhost:8000/v1/models/smoke-pca/predictions?include_masks=true" \
            -F "files=@$RUNNER_TEMP/smoke.png;type=image/png" \
            | python -c '
          import json
          import math
          import sys

          result = json.load(sys.stdin)
          assert result["anomaly_maps"][0][0][0] == 0.0
          assert math.isclose(result["anomaly_maps"][0][1][2], 1 / 3, rel_tol=1e-6)
          assert result["masks"] == [[[False, True, True], [True, True, True]]]
          '

      - name: Show container logs on failure
        if: failure()
        run: docker logs visual-inspection-platform-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force visual-inspection-platform-ci || true
